<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny Lore Masters - Clan Status</title>
    <link rel="icon" href="dlm.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #333;
            --panel-light: #444;
            --text: #fff;
            --muted: #aaa;
            --muted-dark: #888;
            --gold: #ffcc00;
            --green: #00d36f;
            --red: #ff4444;
        }

        * {
            box-sizing: border-box;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
            white-space: normal;
        }

        body {
            font-family: Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
            background:
                linear-gradient(rgba(14, 14, 16, .78), rgba(14, 14, 16, .9)),
                url("DLM.jpg") center top / 70% auto fixed,
                var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 8%, rgba(255, 204, 0, .12), transparent 32%),
                rgba(0, 0, 0, .18);
            pointer-events: none;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 18px 18px calc(26px + env(safe-area-inset-bottom));
        }

        .refresh-box {
            background-color: rgba(68, 68, 68, .88);
            backdrop-filter: blur(8px);
            padding: 11px;
            border-radius: 8px;
            color: var(--text);
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 16px;
            border: 0;
            width: 100%;
        }

        .notify-box {
            display: grid;
            gap: 8px;
            margin: 14px 0 16px;
            padding: 12px;
            border: 1px solid rgba(255, 204, 0, .28);
            border-radius: 8px;
            background-color: rgba(25, 25, 25, .78);
            backdrop-filter: blur(8px);
        }

        .notify-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .notify-button {
            min-height: 38px;
            padding: 8px 12px;
            border: 1px solid rgba(255, 204, 0, .35);
            border-radius: 8px;
            background: rgba(255, 204, 0, .12);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .notify-button:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .notify-status {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
        }

        .refresh-box:disabled {
            cursor: wait;
            opacity: .7;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .status-bar h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.08;
            letter-spacing: 0;
        }

        .title-lockup {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 14px;
        }

        .brand-logo {
            width: 82px;
            height: 82px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(255, 204, 0, .55);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, .06), 0 10px 28px rgba(0, 0, 0, .35);
            flex: 0 0 auto;
        }

        .title-eyebrow {
            margin: 0 0 4px;
            color: var(--gold);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .title-name {
            display: block;
            font-size: 28px;
        }

        .title-count {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 13px;
            font-weight: normal;
        }

        .last-updated {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--muted);
            text-align: right;
        }

        .d3-signatures {
            color: rgba(255, 204, 0, .86);
            font-weight: bold;
            white-space: nowrap;
        }

        .header-side {
            display: grid;
            justify-items: end;
            gap: 6px;
            margin-left: auto;
        }

        .player-stats {
            display: grid;
            justify-items: end;
            gap: 4px;
        }

        .player-stats[hidden] {
            display: none;
        }

        .warmind-stats,
        .marathon-stats {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.15;
        }

        .marathon-stats[hidden] {
            display: none;
        }

        .warmind-label,
        .marathon-label {
            color: rgba(255, 204, 0, .72);
            font-weight: bold;
            text-transform: uppercase;
        }

        .warmind-value,
        .marathon-value {
            padding: 3px 6px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 7px;
            background: rgba(0, 0, 0, .18);
            white-space: nowrap;
        }

        .warmind-value strong,
        .marathon-value strong {
            color: rgba(255, 255, 255, .86);
            font-size: 12px;
        }

        .clan-meta {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 18px;
        }

        .section-label {
            margin: 14px 0 8px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
            line-height: 1.25;
            font-weight: bold;
            text-transform: uppercase;
        }

        .section-label.online-label {
            color: var(--green);
        }

        .section-label.offline-label {
            color: var(--red);
        }

        .member-card {
            background-color: rgba(51, 51, 51, .9);
            backdrop-filter: blur(8px);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 7px;
            display: grid;
            grid-template-columns: 50px minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            cursor: pointer;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            color: inherit;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.3;
            text-align: left;
            background-clip: padding-box;
            -webkit-tap-highlight-color: rgba(255, 204, 0, .18);
        }

        .member-card:hover {
            border-color: rgba(255, 204, 0, .6);
        }

        .emblem-container {
            flex: 0 0 auto;
        }

        .class-icon {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            background: #222;
        }

        .member-info {
            width: 100%;
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 8px;
        }

        .member-main {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
        }

        .member-name {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 8px;
            font-size: 15px;
            line-height: 1.25;
            font-weight: bold;
        }

        .member-name-text,
        .activity,
        .last-seen {
            min-width: 0;
            max-width: 100%;
            overflow-wrap: anywhere;
            word-break: normal;
        }

        .member-name-text {
            display: block;
        }

        .member-class {
            margin-top: 4px;
            font-size: 12px;
            line-height: 1.25;
            color: var(--muted);
        }

        .member-clan {
            margin-top: 4px;
            font-size: 12px;
            line-height: 1.25;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .member-title {
            display: block;
            max-width: 100%;
            margin-top: 5px;
            color: var(--gold);
            font-size: 12px;
            font-weight: bold;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .activity {
            margin-top: 4px;
            font-size: 12px;
            line-height: 1.32;
            color: var(--muted-dark);
        }

        .activity-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 10px;
            margin-top: 4px;
        }

        .activity-row .activity {
            margin-top: 0;
            display: -webkit-box;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .last-seen {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.32;
            text-align: right;
            white-space: nowrap;
        }

        .power-level {
            flex: 0 0 auto;
            font-size: 16px;
            line-height: 1;
            font-weight: bold;
            color: var(--gold);
            margin-left: 0;
            white-space: nowrap;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error,
        .empty {
            color: var(--red);
            text-align: center;
            margin: 20px 0;
            line-height: 1.35;
        }

        .empty {
            color: var(--muted);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background-color: var(--panel);
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 460px;
            max-height: calc(100vh - 32px);
            overflow: auto;
            text-align: left;
            position: relative;
        }

        .modal-title {
            margin: 0 36px 4px 0;
            font-size: 20px;
        }

        .modal-subtitle {
            margin: 0 36px 12px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: var(--text);
            cursor: pointer;
            border: 0;
            background: transparent;
            line-height: 1;
        }

        .activity-item {
            margin: 10px 0;
            padding: 8px;
            background-color: var(--panel-light);
            border-radius: 4px;
        }

        .activity-time {
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .online-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: 0 0 10px;
        }

        .online {
            background-color: var(--green);
        }

        .offline {
            background-color: var(--red);
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px 12px calc(110px + env(safe-area-inset-bottom));
            }

            .status-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-side {
                justify-items: start;
                margin-left: 0;
            }

            .player-stats {
                justify-items: start;
            }

            .warmind-stats,
            .marathon-stats {
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 5px;
            }

            .title-lockup {
                gap: 10px;
            }

            .brand-logo {
                width: 68px;
                height: 68px;
            }

            .title-name {
                font-size: 22px;
            }

            .last-updated {
                justify-content: flex-start;
                text-align: left;
            }

            .class-icon {
                width: 44px;
                height: 44px;
            }

            .member-card {
                align-items: flex-start;
                grid-template-columns: 44px minmax(0, 1fr);
                gap: 10px;
                padding: 10px;
            }

            .member-info {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 8px;
            }

            .power-level {
                align-self: start;
                justify-self: end;
                padding-top: 3px;
                font-size: 15px;
            }

            .member-name {
                align-items: flex-start;
                font-size: 15px;
            }

            .online-status {
                margin-top: 4px;
            }

            .member-class,
            .member-clan,
            .member-title,
            .activity,
            .last-seen,
            .title-count,
            .last-updated,
            .warmind-stats,
            .marathon-stats,
            .clan-meta {
                font-size: 12px;
                line-height: 1.35;
            }

            .activity-row {
                grid-template-columns: minmax(0, 1fr);
                gap: 3px;
            }

            .activity {
                -webkit-line-clamp: 2;
            }

            .last-seen {
                text-align: left;
                white-space: normal;
            }
        }

        @media (max-width: 390px) {
            .brand-logo {
                width: 58px;
                height: 58px;
            }

            .title-name {
                font-size: 20px;
            }

            .member-card {
                gap: 8px;
            }

            .class-icon {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="refresh-box" id="refreshButton" type="button">Ricarica dati pubblicati</button>

        <div class="status-bar">
            <div class="title-lockup">
                <img src="dlm.ico" alt="Destiny Lore Masters" class="brand-logo">
                <h1>
                    <span class="title-eyebrow">Destiny 2 Clan</span>
                    <span class="title-name">Destiny Lore Masters</span>
                    <span class="title-count">Membri del clan: <span id="membersCount">0</span></span>
                </h1>
            </div>
            <div class="header-side">
                <div class="player-stats" id="playerStats" hidden>
                    <div class="warmind-stats" title="Stima Warmind.io, finestra ultime 3 ore">
                        <span class="warmind-label">D2 onLine players</span>
                        <span class="warmind-value">Tot <strong id="warmindTotal">-</strong></span>
                        <span class="warmind-value">PvE <strong id="warmindPve">-</strong></span>
                        <span class="warmind-value">PvP <strong id="warmindPvp">-</strong></span>
                    </div>
                    <div class="marathon-stats" id="marathonStats" title="Giocatori Marathon online su Steam" hidden>
                        <span class="marathon-label">Marathon players</span>
                        <span class="marathon-value">Steam <strong id="marathonTotal">-</strong></span>
                    </div>
                </div>
                <div class="last-updated" id="lastUpdated">
                    <span id="updatedLabel"></span>
                    <span class="d3-signatures" id="d3Signatures" hidden></span>
                </div>
            </div>
        </div>
        <div class="clan-meta" id="clanMeta">Clan: Destiny Lore Masters · Group ID 5420062 · Remote ID 6761737</div>

        <section class="notify-box" aria-label="Accesso Bungie e Hub Stagionale">
            <div class="notify-actions">
                <button class="notify-button" id="bungieLoginButton" type="button">Accedi con Bungie</button>
                <button class="notify-button" id="seasonalHubButton" type="button" disabled>Hub Stagionale</button>
                <button class="notify-button" id="raidPlannerButton" type="button">Raid Planner</button>
            </div>
            <div class="notify-status" id="notifyStatus">Accedi con Bungie per aprire il tuo Hub Stagionale.</div>
        </section>

        <div id="membersList"></div>
    </div>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button class="close-modal" type="button" aria-label="Chiudi">&times;</button>
            <h2 class="modal-title" id="modalTitle">Ultime attività</h2>
            <div class="modal-subtitle" id="modalSubtitle"></div>
            <div id="activityContent"></div>
        </div>
    </div>

    <script>
        const GROUP_ID = '5420062';
        const REMOTE_GROUP_ID = '6761737';
        const STATIC_DATA_URL = 'data/clan-status.json';
        const PLAYER_ACTIVITY_URL = 'data/player-activity.json';
        const WORKER_BASE_URL = 'https://dlm-notify.gmeluzzi.workers.dev';
        const D3_SIGNATURES_URL = `${WORKER_BASE_URL}/api/d3-signatures`;
        const DLM_USER_STORAGE_KEY = 'dlmNotifyUserId';
        const LIVE_STATUS_INTERVAL_MS = 60000;

        let currentMembers = [];
        let currentExternalFriends = [];
        let currentUpdatedLabel = '';
        let currentD3Signatures = null;
        let liveStatusTimer = null;

        const elements = {
            refreshButton: document.getElementById('refreshButton'),
            membersCount: document.getElementById('membersCount'),
            lastUpdated: document.getElementById('lastUpdated'),
            updatedLabel: document.getElementById('updatedLabel'),
            d3Signatures: document.getElementById('d3Signatures'),
            playerStats: document.getElementById('playerStats'),
            marathonStats: document.getElementById('marathonStats'),
            marathonTotal: document.getElementById('marathonTotal'),
            warmindTotal: document.getElementById('warmindTotal'),
            warmindPve: document.getElementById('warmindPve'),
            warmindPvp: document.getElementById('warmindPvp'),
            membersList: document.getElementById('membersList'),
            modal: document.getElementById('modal'),
            modalTitle: document.getElementById('modalTitle'),
            modalSubtitle: document.getElementById('modalSubtitle'),
            activityContent: document.getElementById('activityContent')
        };

        const notifyElements = {
            loginButton: document.getElementById('bungieLoginButton'),
            seasonalHubButton: document.getElementById('seasonalHubButton'),
            raidPlannerButton: document.getElementById('raidPlannerButton'),
            status: document.getElementById('notifyStatus')
        };

        document.addEventListener('DOMContentLoaded', initializeApp);
        elements.refreshButton.addEventListener('click', loadStaticData);
        notifyElements.loginButton.addEventListener('click', startBungieLogin);
        notifyElements.seasonalHubButton.addEventListener('click', () => {
            window.location.href = 'seasonal-hub.html';
        });
        notifyElements.raidPlannerButton.addEventListener('click', () => {
            window.location.href = 'raid-planner.html';
        });
        document.querySelector('.close-modal').addEventListener('click', closeModal);
        window.addEventListener('click', (event) => {
            if (event.target === elements.modal) closeModal();
        });
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });

        async function initializeApp() {
            showLoader();
            try {
                initializeNotificationUi();
                await loadStaticData();
            } catch (error) {
                console.error('Errore caricamento dati:', error);
                showError(error);
            }
        }

        function initializeNotificationUi() {
            const url = new URL(window.location.href);
            const userId = url.searchParams.get('dlmUser');
            if (userId) {
                localStorage.setItem(DLM_USER_STORAGE_KEY, userId);
                url.searchParams.delete('dlmUser');
                window.history.replaceState({}, document.title, url.toString());
            }
            const authError = url.searchParams.get('dlmAuthError');
            if (authError) {
                url.searchParams.delete('dlmAuthError');
                window.history.replaceState({}, document.title, url.toString());
            }

            const storedUserId = localStorage.getItem(DLM_USER_STORAGE_KEY);
            const configured = !WORKER_BASE_URL.includes('YOUR-SUBDOMAIN');
            notifyElements.loginButton.disabled = !configured || Boolean(storedUserId);
            notifyElements.seasonalHubButton.disabled = !storedUserId;

            if (!configured) {
                notifyElements.status.textContent = 'Accesso Bungie non configurato: imposta WORKER_BASE_URL dopo il deploy del Cloudflare Worker.';
            } else if (authError) {
                notifyElements.status.textContent = `Accesso Bungie non riuscito: ${authError}`;
            } else if (storedUserId) {
                notifyElements.loginButton.textContent = 'Autenticato';
                notifyElements.status.textContent = 'Accesso Bungie registrato. Hub Stagionale disponibile.';
            } else {
                notifyElements.loginButton.textContent = 'Accedi con Bungie';
                notifyElements.status.textContent = 'Accedi con Bungie per aprire il tuo Hub Stagionale.';
            }
        }

        function startBungieLogin() {
            if (localStorage.getItem(DLM_USER_STORAGE_KEY)) {
                notifyElements.status.textContent = 'Accesso Bungie gia completato.';
                return;
            }

            window.location.href = `${WORKER_BASE_URL}/auth/login`;
        }

        async function readErrorMessage(response) {
            try {
                const data = await response.json();
                return data.error || data.message || '';
            } catch {
                return '';
            }
        }

        async function loadStaticData() {
            showLoader();
            elements.refreshButton.disabled = true;

            try {
                const response = await fetch(`${STATIC_DATA_URL}?v=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Dati clan non disponibili. Attendi il completamento della GitHub Action.');
                }

                const data = await response.json();
                currentMembers = (data.members || []).sort(compareDisplayMembers);
                elements.membersCount.textContent = String(currentMembers.length);
                currentUpdatedLabel = data.generatedAt
                    ? `Aggiornato: ${formatDate(data.generatedAt)}`
                    : 'Aggiornato: dati pubblicati';
                renderHeaderMeta();
                renderDashboard();
                loadPlayerActivityStats();
                loadD3Signatures();
                startLiveStatusPolling();
            } catch (error) {
                console.error('Errore caricamento dati:', error);
                showError(error);
            } finally {
                elements.refreshButton.disabled = false;
            }
        }
        function renderDashboard() {
            elements.membersList.innerHTML = '';

            if (!currentMembers.length) {
                elements.membersList.innerHTML = '<div class="empty">Nessun membro trovato.</div>';
                return;
            }

            renderMembers(currentMembers);
            renderExternalFriends(currentExternalFriends);
        }

        function renderMembers(members) {
            let currentSection = '';
            members.forEach(member => {
                const section = member.isOnline ? 'Online' : 'Offline';
                if (section !== currentSection) {
                    const sectionLabel = document.createElement('div');
                    sectionLabel.className = `section-label ${member.isOnline ? 'online-label' : 'offline-label'}`;
                    sectionLabel.textContent = section;
                    elements.membersList.appendChild(sectionLabel);
                    currentSection = section;
                }
                elements.membersList.appendChild(createMemberCard(member));
            });
        }

        function renderExternalFriends(friends) {
            if (!friends.length) return;

            let currentSection = '';
            friends.forEach(friend => {
                const section = friend.isOnline ? 'Amici Bungie online fuori clan' : 'Amici Bungie offline fuori clan';
                if (section !== currentSection) {
                    const sectionLabel = document.createElement('div');
                    sectionLabel.className = `section-label ${friend.isOnline ? 'online-label' : 'offline-label'}`;
                    sectionLabel.textContent = section;
                    elements.membersList.appendChild(sectionLabel);
                    currentSection = section;
                }
                elements.membersList.appendChild(createFriendCard(friend));
            });
        }

        function startLiveStatusPolling() {
            if (liveStatusTimer) return;

            refreshLiveStatus();
            liveStatusTimer = window.setInterval(refreshLiveStatus, LIVE_STATUS_INTERVAL_MS);
        }

        async function refreshLiveStatus() {
            if (!currentMembers.length) return;

            try {
                const response = await fetch(`${WORKER_BASE_URL}/api/clan-presence`, {
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error(await readErrorMessage(response) || 'Presenza clan non disponibile.');

                const data = await response.json();
                const liveMap = createLiveStatusMap(data.members || []);
                let changed = false;

                currentMembers = currentMembers.map((member) => {
                    const liveStatus = findLiveStatus(member, liveMap);
                    if (!liveStatus || member.isOnline === liveStatus.isOnline) return member;
                    changed = true;
                    return { ...member, isOnline: liveStatus.isOnline };
                });

                if (changed) {
                    currentMembers.sort(compareDisplayMembers);
                    renderDashboard();
                }
            } catch (error) {
                console.warn('Aggiornamento live online/offline non riuscito:', error);
            }

            await refreshOnlineExternalFriends();
        }

        async function refreshOnlineExternalFriends() {
            const userId = localStorage.getItem(DLM_USER_STORAGE_KEY);
            if (!userId || !currentMembers.length) {
                if (currentExternalFriends.length) {
                    currentExternalFriends = [];
                    renderDashboard();
                }
                return;
            }

            try {
                const response = await fetch(`${WORKER_BASE_URL}/api/friends-details?userId=${encodeURIComponent(userId)}&locale=it`, {
                    cache: 'no-store'
                });
                if (!response.ok) {
                    const message = await readErrorMessage(response) || 'Stato amici non disponibile.';
                    if (isStaleSessionMessage(message)) {
                        localStorage.removeItem(DLM_USER_STORAGE_KEY);
                        initializeNotificationUi();
                        throw new Error('Sessione Bungie non trovata. Effettua di nuovo l accesso.');
                    }
                    throw new Error(message);
                }

                const data = await response.json();
                const clanKeys = createClanKeySet(currentMembers);
                const nextFriends = (data.friends || [])
                    .filter(friend => !isKnownClanMember(friend, clanKeys))
                    .sort(compareDisplayMembers);

                if (JSON.stringify(nextFriends) !== JSON.stringify(currentExternalFriends)) {
                    currentExternalFriends = nextFriends;
                    renderDashboard();
                }
            } catch (error) {
                console.warn('Aggiornamento amici online fuori clan non riuscito:', error);
            }
        }

        function createLiveStatusMap(friends) {
            const map = new Map();
            friends.forEach((friend) => {
                [
                    friend.id,
                    friend.membershipId,
                    friend.bungieNetMembershipId,
                    normalizeName(friend.displayName)
                ].filter(Boolean).forEach((key) => map.set(String(key), friend));
            });
            return map;
        }

        function findLiveStatus(member, liveMap) {
            return liveMap.get(String(member.membershipId || ''))
                || liveMap.get(String(member.bungieNetMembershipId || ''))
                || liveMap.get(normalizeName(member.displayName));
        }

        function normalizeName(value) {
            return String(value || '').trim().toLowerCase();
        }

        function createClanKeySet(members) {
            const keys = new Set();
            members.forEach(member => {
                [
                    member.membershipId,
                    member.bungieNetMembershipId,
                    normalizeName(member.displayName)
                ].filter(Boolean).forEach(key => keys.add(String(key)));
            });
            return keys;
        }

        function isKnownClanMember(friend, clanKeys) {
            return [
                friend.id,
                friend.membershipId,
                friend.bungieNetMembershipId,
                normalizeName(friend.displayName)
            ].filter(Boolean).some(key => clanKeys.has(String(key)));
        }

        async function loadPlayerActivityStats() {
            try {
                const response = await fetch(`${PLAYER_ACTIVITY_URL}?v=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('Statistiche Warmind non disponibili.');
                const data = await response.json();
                elements.warmindTotal.textContent = formatCompactNumber(data.averageConcurrentPlayers);
                elements.warmindPve.textContent = formatCompactNumber(data.pvePlayers);
                elements.warmindPvp.textContent = formatCompactNumber(data.pvpPlayers);
                if (Number.isFinite(Number(data.marathonPlayers))) {
                    elements.marathonTotal.textContent = formatCompactNumber(data.marathonPlayers);
                    elements.marathonStats.hidden = false;
                } else {
                    elements.marathonStats.hidden = true;
                }
                elements.playerStats.hidden = false;
            } catch (error) {
                console.warn('Statistiche Warmind non disponibili:', error);
                elements.playerStats.hidden = true;
            }
        }

        async function loadD3Signatures() {
            try {
                const response = await fetch(`${D3_SIGNATURES_URL}?v=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(await readErrorMessage(response) || 'Firme D3 non disponibili.');
                const data = await response.json();
                currentD3Signatures = Number(data.signatures || 0);
                renderHeaderMeta();
            } catch (error) {
                console.warn('Numero firme D3 non disponibile:', error);
                currentD3Signatures = null;
                renderHeaderMeta();
            }
        }

        function renderHeaderMeta() {
            elements.updatedLabel.textContent = currentUpdatedLabel;
            if (Number.isFinite(currentD3Signatures) && currentD3Signatures > 0) {
                elements.d3Signatures.textContent = `Firme D3: ${formatNumber(currentD3Signatures)}`;
                elements.d3Signatures.hidden = false;
            } else {
                elements.d3Signatures.textContent = '';
                elements.d3Signatures.hidden = true;
            }
        }

        function isStaleSessionMessage(message) {
            const normalized = String(message || '').toLowerCase();
            return normalized === 'unknown user'
                || normalized === 'not found'
                || normalized === 'session expired'
                || normalized.includes('missing required parameter refresh_token');
        }

        function renderSection(label, members, className) {
            if (!members.length) return;

            const sectionLabel = document.createElement('div');
            sectionLabel.className = `section-label ${className}`;
            sectionLabel.textContent = `${label} (${members.length})`;
            elements.membersList.appendChild(sectionLabel);

            members.forEach(member => {
                elements.membersList.appendChild(createMemberCard(member));
            });
        }

        function createMemberCard(member) {
            const card = document.createElement('button');
            card.className = 'member-card';
            card.type = 'button';
            card.addEventListener('click', () => openModal(member));

            const emblemContainer = document.createElement('div');
            emblemContainer.className = 'emblem-container';

            const image = document.createElement('img');
            image.className = 'class-icon';
            image.src = member.classIcon;
            image.alt = member.className;
            image.onerror = () => {
                image.src = 'dlm.ico';
            };

            const memberInfo = document.createElement('div');
            memberInfo.className = 'member-info';

            const memberMain = document.createElement('div');
            memberMain.className = 'member-main';

            const memberName = document.createElement('div');
            memberName.className = 'member-name';

            const status = document.createElement('span');
            status.className = `online-status ${member.isOnline ? 'online' : 'offline'}`;

            const nameText = document.createElement('span');
            nameText.className = 'member-name-text';
            nameText.textContent = member.displayName;

            const memberClass = document.createElement('div');
            memberClass.className = 'member-class';
            memberClass.textContent = member.className;

            const memberTitle = document.createElement('div');
            memberTitle.className = 'member-title';
            memberTitle.textContent = member.title || '';
            memberTitle.hidden = !member.title;

            const memberClan = document.createElement('div');
            memberClan.className = 'member-clan';
            memberClan.textContent = formatClanName(member);
            memberClan.hidden = !memberClan.textContent;

            const activity = document.createElement('div');
            activity.className = 'activity';
            activity.textContent = member.isOnline ? 'Online' : `Ultima attività: ${member.lastActivityText}`;

            const lastSeen = document.createElement('div');
            lastSeen.className = 'last-seen';
            lastSeen.textContent = member.lastPlayedTimestamp
                ? `Last seen: ${formatDate(member.lastPlayedTimestamp)}`
                : '';
            lastSeen.hidden = !member.lastPlayedTimestamp;

            const activityRow = document.createElement('div');
            activityRow.className = 'activity-row';
            activityRow.append(activity, lastSeen);

            const power = document.createElement('div');
            power.className = 'power-level';
            power.textContent = member.powerLevel ? String(member.powerLevel) : '-';

            memberName.append(status, nameText);
            memberMain.append(memberName, memberClass, memberClan, memberTitle, activityRow);
            memberInfo.append(memberMain, power);
            emblemContainer.appendChild(image);
            card.append(emblemContainer, memberInfo);

            return card;
        }

        function createFriendCard(friend) {
            return createMemberCard({
                displayName: friend.displayName,
                isOnline: Boolean(friend.isOnline),
                className: friend.className || 'Amico Bungie',
                title: friend.title || '',
                classIcon: friend.classIcon || 'dlm.ico',
                powerLevel: friend.powerLevel || 0,
                lastPlayedTimestamp: friend.lastPlayedTimestamp || 0,
                lastActivityTimestamp: friend.lastActivityTimestamp || 0,
                lastActivityText: friend.lastActivityText || (friend.isOnline ? 'Online' : 'Nessuna attività recente'),
                clanName: friend.clanName || '',
                clanCallsign: friend.clanCallsign || '',
                clanGroupId: friend.clanGroupId || '',
                activities: friend.activities || []
            });
        }

        function formatClanName(member) {
            if (!member.clanName) return '';
            return member.clanCallsign
                ? `Clan: ${member.clanName} [${member.clanCallsign}]`
                : `Clan: ${member.clanName}`;
        }

        async function openModal(member) {
            elements.modalTitle.textContent = 'Ultime attività';
            elements.modalSubtitle.textContent = member.displayName;
            elements.modal.style.display = 'flex';
            renderActivities(member.activities || []);
        }
        function renderActivities(activities) {
            elements.activityContent.innerHTML = '';

            if (!activities.length) {
                elements.activityContent.innerHTML = '<div class="empty">Nessuna attività trovata.</div>';
                return;
            }

            activities.forEach(activity => {
                const activityItem = document.createElement('div');
                activityItem.className = 'activity-item';

                const title = document.createElement('div');
                title.textContent = activity.name || 'Attività sconosciuta';

                const time = document.createElement('div');
                time.className = 'activity-time';
                time.textContent = formatDate(activity.period);

                activityItem.append(title, time);
                elements.activityContent.appendChild(activityItem);
            });
        }

        function compareMembers(a, b) {
            const aTime = a.lastActivityTimestamp || a.lastPlayedTimestamp || 0;
            const bTime = b.lastActivityTimestamp || b.lastPlayedTimestamp || 0;
            if (aTime !== bTime) return bTime - aTime;
            return a.displayName.localeCompare(b.displayName, 'it');
        }

        function compareDisplayMembers(a, b) {
            if (a.isOnline !== b.isOnline) return a.isOnline ? -1 : 1;
            return compareMembers(a, b);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return 'N/A';
            return date.toLocaleDateString('it-IT') + ' ' + date.toLocaleTimeString('it-IT', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatCompactNumber(value) {
            const number = Number(value || 0);
            if (!Number.isFinite(number) || number <= 0) return '-';
            return new Intl.NumberFormat('it-IT', {
                notation: 'compact',
                maximumFractionDigits: 1
            }).format(number);
        }

        function formatNumber(value) {
            const number = Number(value || 0);
            if (!Number.isFinite(number) || number <= 0) return '-';
            return new Intl.NumberFormat('it-IT').format(number);
        }

        function closeModal() {
            elements.modal.style.display = 'none';
        }

        function updateLastUpdated() {
            lastUpdate = new Date();
            currentUpdatedLabel = `Aggiornato: ${lastUpdate.toLocaleTimeString('it-IT', {
                hour: '2-digit',
                minute: '2-digit'
            })}`;
            renderHeaderMeta();
        }

        function showLoader() {
            elements.membersList.innerHTML = '<div class="loader"></div>';
        }

        function showError(error) {
            const message = error && error.message ? error.message : 'Errore nel caricamento dati.';
            elements.membersList.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.DLM_DEBUG = {
            getCurrentMembers: () => currentMembers,
            groupId: GROUP_ID,
            remoteGroupId: REMOTE_GROUP_ID,
            refresh: loadStaticData
        };
    </script>
</body>
</html>
