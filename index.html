<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny Lore Masters - Clan Status</title>
    <link rel="icon" href="dlm.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #333;
            --panel-light: #444;
            --text: #fff;
            --muted: #aaa;
            --muted-dark: #888;
            --gold: #ffcc00;
            --green: #00d36f;
            --red: #ff4444;
        }

        * {
            box-sizing: border-box;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
            white-space: normal;
        }

        body {
            font-family: Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
            background:
                linear-gradient(rgba(14, 14, 16, .78), rgba(14, 14, 16, .9)),
                url("DLM.jpg") center top / 70% auto fixed,
                var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 8%, rgba(255, 204, 0, .12), transparent 32%),
                rgba(0, 0, 0, .18);
            pointer-events: none;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 18px 18px calc(26px + env(safe-area-inset-bottom));
        }

        .refresh-box {
            background-color: rgba(68, 68, 68, .88);
            backdrop-filter: blur(8px);
            padding: 11px;
            border-radius: 8px;
            color: var(--text);
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 16px;
            border: 0;
            width: 100%;
        }

        .notify-box {
            display: grid;
            gap: 8px;
            margin-bottom: 18px;
            padding: 12px;
            border: 1px solid rgba(255, 204, 0, .28);
            border-radius: 8px;
            background-color: rgba(25, 25, 25, .78);
            backdrop-filter: blur(8px);
        }

        .notify-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .notify-button {
            min-height: 38px;
            padding: 8px 12px;
            border: 1px solid rgba(255, 204, 0, .35);
            border-radius: 8px;
            background: rgba(255, 204, 0, .12);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .notify-button:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .notify-status {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
        }

        .refresh-box:disabled {
            cursor: wait;
            opacity: .7;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .status-bar h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.08;
            letter-spacing: 0;
        }

        .title-lockup {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 14px;
        }

        .brand-logo {
            width: 82px;
            height: 82px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(255, 204, 0, .55);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, .06), 0 10px 28px rgba(0, 0, 0, .35);
            flex: 0 0 auto;
        }

        .title-eyebrow {
            margin: 0 0 4px;
            color: var(--gold);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .title-name {
            display: block;
            font-size: 28px;
        }

        .title-count {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 13px;
            font-weight: normal;
        }

        .last-updated {
            font-size: 14px;
            color: var(--muted);
            text-align: right;
        }

        .clan-meta {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 18px;
        }

        .section-label {
            margin: 14px 0 8px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
            line-height: 1.25;
            font-weight: bold;
            text-transform: uppercase;
        }

        .section-label.online-label {
            color: var(--green);
        }

        .section-label.offline-label {
            color: var(--red);
        }

        .member-card {
            background-color: rgba(51, 51, 51, .9);
            backdrop-filter: blur(8px);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 7px;
            display: grid;
            grid-template-columns: 50px minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            cursor: pointer;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            color: inherit;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.3;
            text-align: left;
            background-clip: padding-box;
            -webkit-tap-highlight-color: rgba(255, 204, 0, .18);
        }

        .member-card:hover {
            border-color: rgba(255, 204, 0, .6);
        }

        .emblem-container {
            flex: 0 0 auto;
        }

        .class-icon {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            background: #222;
        }

        .member-info {
            width: 100%;
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 8px;
        }

        .member-main {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
        }

        .member-name {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 8px;
            font-size: 15px;
            line-height: 1.25;
            font-weight: bold;
        }

        .member-name-text,
        .activity {
            min-width: 0;
            max-width: 100%;
            overflow-wrap: anywhere;
            word-break: normal;
        }

        .member-name-text {
            display: block;
        }

        .member-class {
            margin-top: 4px;
            font-size: 12px;
            line-height: 1.25;
            color: var(--muted);
        }

        .member-title {
            display: block;
            max-width: 100%;
            margin-top: 5px;
            color: var(--gold);
            font-size: 12px;
            font-weight: bold;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .activity {
            margin-top: 4px;
            font-size: 12px;
            line-height: 1.32;
            color: var(--muted-dark);
            display: -webkit-box;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .power-level {
            flex: 0 0 auto;
            font-size: 16px;
            line-height: 1;
            font-weight: bold;
            color: var(--gold);
            margin-left: 0;
            white-space: nowrap;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error,
        .empty {
            color: var(--red);
            text-align: center;
            margin: 20px 0;
            line-height: 1.35;
        }

        .empty {
            color: var(--muted);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background-color: var(--panel);
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 460px;
            max-height: calc(100vh - 32px);
            overflow: auto;
            text-align: left;
            position: relative;
        }

        .modal-title {
            margin: 0 36px 4px 0;
            font-size: 20px;
        }

        .modal-subtitle {
            margin: 0 36px 12px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: var(--text);
            cursor: pointer;
            border: 0;
            background: transparent;
            line-height: 1;
        }

        .activity-item {
            margin: 10px 0;
            padding: 8px;
            background-color: var(--panel-light);
            border-radius: 4px;
        }

        .activity-time {
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .online-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: 0 0 10px;
        }

        .online {
            background-color: var(--green);
        }

        .offline {
            background-color: var(--red);
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px 12px calc(110px + env(safe-area-inset-bottom));
            }

            .status-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .title-lockup {
                gap: 10px;
            }

            .brand-logo {
                width: 68px;
                height: 68px;
            }

            .title-name {
                font-size: 22px;
            }

            .last-updated {
                text-align: left;
            }

            .class-icon {
                width: 44px;
                height: 44px;
            }

            .member-card {
                align-items: flex-start;
                grid-template-columns: 44px minmax(0, 1fr);
                gap: 10px;
                padding: 10px;
            }

            .member-info {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 8px;
            }

            .power-level {
                align-self: start;
                justify-self: end;
                padding-top: 3px;
                font-size: 15px;
            }

            .member-name {
                align-items: flex-start;
                font-size: 15px;
            }

            .online-status {
                margin-top: 4px;
            }

            .member-class,
            .member-title,
            .activity,
            .title-count,
            .last-updated,
            .clan-meta {
                font-size: 12px;
                line-height: 1.35;
            }

            .activity {
                -webkit-line-clamp: 2;
            }
        }

        @media (max-width: 390px) {
            .brand-logo {
                width: 58px;
                height: 58px;
            }

            .title-name {
                font-size: 20px;
            }

            .member-card {
                gap: 8px;
            }

            .class-icon {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="refresh-box" id="refreshButton" type="button">Ricarica dati pubblicati</button>

        <section class="notify-box" aria-label="Notifiche amici online">
            <div class="notify-actions">
                <button class="notify-button" id="bungieLoginButton" type="button">Accedi con Bungie</button>
                <button class="notify-button" id="enablePushButton" type="button" disabled>Attiva notifiche amici online</button>
            </div>
            <div class="notify-status" id="notifyStatus">Accesso Bungie richiesto per ricevere notifiche quando un amico compare online.</div>
        </section>

        <div class="status-bar">
            <div class="title-lockup">
                <img src="dlm.ico" alt="Destiny Lore Masters" class="brand-logo">
                <h1>
                    <span class="title-eyebrow">Destiny 2 Clan</span>
                    <span class="title-name">Destiny Lore Masters</span>
                    <span class="title-count">Membri del clan: <span id="membersCount">0</span></span>
                </h1>
            </div>
            <div class="last-updated" id="lastUpdated"></div>
        </div>
        <div class="clan-meta" id="clanMeta">Clan: Destiny Lore Masters · Group ID 5420062 · Remote ID 6761737</div>
        <div id="membersList"></div>
    </div>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button class="close-modal" type="button" aria-label="Chiudi">&times;</button>
            <h2 class="modal-title" id="modalTitle">Ultime attività</h2>
            <div class="modal-subtitle" id="modalSubtitle"></div>
            <div id="activityContent"></div>
        </div>
    </div>

    <script>
        const GROUP_ID = '5420062';
        const REMOTE_GROUP_ID = '6761737';
        const STATIC_DATA_URL = 'data/clan-status.json';
        const WORKER_BASE_URL = 'https://dlm-notify.gmeluzzi.workers.dev';
        const DLM_USER_STORAGE_KEY = 'dlmNotifyUserId';
        const LIVE_STATUS_INTERVAL_MS = 60000;

        let currentMembers = [];
        let liveStatusTimer = null;

        const elements = {
            refreshButton: document.getElementById('refreshButton'),
            membersCount: document.getElementById('membersCount'),
            lastUpdated: document.getElementById('lastUpdated'),
            membersList: document.getElementById('membersList'),
            modal: document.getElementById('modal'),
            modalTitle: document.getElementById('modalTitle'),
            modalSubtitle: document.getElementById('modalSubtitle'),
            activityContent: document.getElementById('activityContent')
        };

        const notifyElements = {
            loginButton: document.getElementById('bungieLoginButton'),
            enablePushButton: document.getElementById('enablePushButton'),
            status: document.getElementById('notifyStatus')
        };

        document.addEventListener('DOMContentLoaded', initializeApp);
        elements.refreshButton.addEventListener('click', loadStaticData);
        notifyElements.loginButton.addEventListener('click', startBungieLogin);
        notifyElements.enablePushButton.addEventListener('click', enableFriendNotifications);
        document.querySelector('.close-modal').addEventListener('click', closeModal);
        window.addEventListener('click', (event) => {
            if (event.target === elements.modal) closeModal();
        });
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });

        async function initializeApp() {
            showLoader();
            try {
                initializeNotificationUi();
                await loadStaticData();
            } catch (error) {
                console.error('Errore caricamento dati:', error);
                showError(error);
            }
        }

        function initializeNotificationUi() {
            const url = new URL(window.location.href);
            const userId = url.searchParams.get('dlmUser');
            if (userId) {
                localStorage.setItem(DLM_USER_STORAGE_KEY, userId);
                url.searchParams.delete('dlmUser');
                window.history.replaceState({}, document.title, url.toString());
            }
            const authError = url.searchParams.get('dlmAuthError');
            if (authError) {
                url.searchParams.delete('dlmAuthError');
                window.history.replaceState({}, document.title, url.toString());
            }

            const storedUserId = localStorage.getItem(DLM_USER_STORAGE_KEY);
            const configured = !WORKER_BASE_URL.includes('YOUR-SUBDOMAIN');
            const supportsPush = supportsWebPush();
            const iosNeedsHomeScreen = isIosDevice() && !isStandaloneApp();
            notifyElements.loginButton.disabled = !configured || Boolean(storedUserId);
            notifyElements.enablePushButton.disabled = !configured || !storedUserId || !supportsPush || iosNeedsHomeScreen;

            if (!configured) {
                notifyElements.status.textContent = 'Notifiche non configurate: imposta WORKER_BASE_URL dopo il deploy del Cloudflare Worker.';
            } else if (authError) {
                notifyElements.status.textContent = `Accesso Bungie non riuscito: ${authError}`;
            } else if (storedUserId) {
                notifyElements.loginButton.textContent = 'Autenticato';
                if (iosNeedsHomeScreen) {
                    notifyElements.status.textContent = getIosHomeScreenInstructions(true);
                } else if (!supportsPush) {
                    notifyElements.status.textContent = 'Questo browser non supporta le notifiche push web.';
                } else if ('Notification' in window && Notification.permission === 'granted') {
                    notifyElements.status.textContent = 'Notifiche gia autorizzate su questo dispositivo.';
                } else {
                    notifyElements.status.textContent = 'Accesso Bungie registrato. Puoi attivare le notifiche push su questo dispositivo.';
                }
            } else {
                notifyElements.loginButton.textContent = 'Accedi con Bungie';
                notifyElements.status.textContent = isIosDevice() && isStandaloneApp()
                    ? 'Ora accedi con Bungie da questa app installata, poi attiva le notifiche.'
                    : 'Accesso Bungie richiesto per ricevere notifiche quando un amico compare online.';
            }
        }

        function isIosDevice() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        function isStandaloneApp() {
            return window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
        }

        function supportsWebPush() {
            return 'Notification' in window
                && 'serviceWorker' in navigator
                && 'PushManager' in window;
        }

        function getIosHomeScreenInstructions(alreadyAuthenticated = false) {
            const suffix = alreadyAuthenticated
                ? ' iPhone non trasferisce l accesso da Safari: nella nuova app dovrai premere di nuovo Accedi con Bungie.'
                : '';
            return `Su iPhone: apri il sito in Safari, tocca Condividi, scegli Aggiungi alla schermata Home, poi apri DLM dalla nuova icona.${suffix}`;
        }

        function startBungieLogin() {
            if (localStorage.getItem(DLM_USER_STORAGE_KEY)) {
                notifyElements.status.textContent = 'Accesso Bungie gia completato.';
                return;
            }

            window.location.href = `${WORKER_BASE_URL}/auth/login`;
        }

        async function enableFriendNotifications() {
            const userId = localStorage.getItem(DLM_USER_STORAGE_KEY);
            if (!userId) {
                notifyElements.status.textContent = 'Prima accedi con Bungie.';
                return;
            }

            if (isIosDevice() && !isStandaloneApp()) {
                notifyElements.status.textContent = getIosHomeScreenInstructions();
                return;
            }

            if (!supportsWebPush()) {
                notifyElements.status.textContent = 'Questo browser non supporta le notifiche push web.';
                return;
            }

            if (Notification.permission === 'denied') {
                notifyElements.status.textContent = 'Permesso notifiche bloccato: abilitalo dalle impostazioni del browser o di iOS.';
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                notifyElements.status.textContent = 'Permesso notifiche non concesso.';
                return;
            }

            notifyElements.enablePushButton.disabled = true;
            notifyElements.status.textContent = 'Registro il dispositivo per le notifiche...';

            try {
                const configResponse = await withTimeout(
                    fetch(`${WORKER_BASE_URL}/api/config`),
                    12000,
                    'Configurazione notifiche non disponibile.'
                );
                if (!configResponse.ok) throw new Error('Configurazione notifiche non disponibile.');
                const config = await configResponse.json();

                notifyElements.status.textContent = 'Preparo le notifiche sul dispositivo...';
                await navigator.serviceWorker.register('sw.js');
                const registration = await withTimeout(
                    navigator.serviceWorker.ready,
                    12000,
                    'Service worker non pronto. Riapri la webapp e riprova.'
                );

                notifyElements.status.textContent = 'Creo la sottoscrizione push...';
                let subscription = await registration.pushManager.getSubscription();
                if (!subscription) {
                    subscription = await withTimeout(
                        registration.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: urlBase64ToUint8Array(config.vapidPublicKey)
                        }),
                        20000,
                        'iOS non ha completato la sottoscrizione push. Chiudi e riapri DLM dalla schermata Home.'
                    );
                }

                notifyElements.status.textContent = 'Salvo il dispositivo per le notifiche...';
                const response = await withTimeout(
                    fetch(`${WORKER_BASE_URL}/api/subscribe`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, subscription })
                    }),
                    12000,
                    'Registrazione notifiche non riuscita.'
                );

                if (!response.ok) {
                    const message = await readErrorMessage(response);
                    throw new Error(message || 'Registrazione notifiche non riuscita.');
                }
                notifyElements.status.textContent = 'Notifiche attive su questo dispositivo. Ti ho inviato una notifica di test.';
            } catch (error) {
                console.error('Registrazione notifiche fallita:', error);
                notifyElements.enablePushButton.disabled = false;
                notifyElements.status.textContent = error.message || 'Registrazione notifiche non riuscita.';
            }
        }

        function urlBase64ToUint8Array(value) {
            const padding = '='.repeat((4 - value.length % 4) % 4);
            const base64 = (value + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
        }

        function withTimeout(promise, timeoutMs, message) {
            return Promise.race([
                promise,
                new Promise((_, reject) => {
                    window.setTimeout(() => reject(new Error(message)), timeoutMs);
                })
            ]);
        }

        async function readErrorMessage(response) {
            try {
                const data = await response.json();
                return data.error || data.message || '';
            } catch {
                return '';
            }
        }

        async function loadStaticData() {
            showLoader();
            elements.refreshButton.disabled = true;

            try {
                const response = await fetch(`${STATIC_DATA_URL}?v=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Dati clan non disponibili. Attendi il completamento della GitHub Action.');
                }

                const data = await response.json();
                currentMembers = (data.members || []).sort(compareDisplayMembers);
                elements.membersCount.textContent = String(currentMembers.length);
                elements.lastUpdated.textContent = data.generatedAt
                    ? `Aggiornato: ${formatDate(data.generatedAt)}`
                    : 'Aggiornato: dati pubblicati';
                renderMembers(currentMembers);
                startLiveStatusPolling();
            } catch (error) {
                console.error('Errore caricamento dati:', error);
                showError(error);
            } finally {
                elements.refreshButton.disabled = false;
            }
        }
        function renderMembers(members) {
            elements.membersList.innerHTML = '';

            if (!members.length) {
                elements.membersList.innerHTML = '<div class="empty">Nessun membro trovato.</div>';
                return;
            }

            let currentSection = '';
            members.forEach(member => {
                const section = member.isOnline ? 'Online' : 'Offline';
                if (section !== currentSection) {
                    const sectionLabel = document.createElement('div');
                    sectionLabel.className = `section-label ${member.isOnline ? 'online-label' : 'offline-label'}`;
                    sectionLabel.textContent = section;
                    elements.membersList.appendChild(sectionLabel);
                    currentSection = section;
                }
                elements.membersList.appendChild(createMemberCard(member));
            });
        }

        function startLiveStatusPolling() {
            if (liveStatusTimer) return;

            refreshLiveFriendStatus();
            liveStatusTimer = window.setInterval(refreshLiveFriendStatus, LIVE_STATUS_INTERVAL_MS);
        }

        async function refreshLiveFriendStatus() {
            if (!currentMembers.length) return;

            try {
                const response = await fetch(`${WORKER_BASE_URL}/api/clan-presence`, {
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error(await readErrorMessage(response) || 'Presenza clan non disponibile.');

                const data = await response.json();
                const liveMap = createLiveStatusMap(data.members || []);
                let changed = false;

                currentMembers = currentMembers.map((member) => {
                    const liveStatus = findLiveStatus(member, liveMap);
                    if (!liveStatus || member.isOnline === liveStatus.isOnline) return member;
                    changed = true;
                    return { ...member, isOnline: liveStatus.isOnline };
                });

                if (changed) {
                    currentMembers.sort(compareDisplayMembers);
                    renderMembers(currentMembers);
                }
            } catch (error) {
                console.warn('Aggiornamento live online/offline non riuscito:', error);
            }
        }

        function createLiveStatusMap(friends) {
            const map = new Map();
            friends.forEach((friend) => {
                [
                    friend.id,
                    friend.membershipId,
                    friend.bungieNetMembershipId,
                    normalizeName(friend.displayName)
                ].filter(Boolean).forEach((key) => map.set(String(key), friend));
            });
            return map;
        }

        function findLiveStatus(member, liveMap) {
            return liveMap.get(String(member.membershipId || ''))
                || liveMap.get(String(member.bungieNetMembershipId || ''))
                || liveMap.get(normalizeName(member.displayName));
        }

        function normalizeName(value) {
            return String(value || '').trim().toLowerCase();
        }

        function renderSection(label, members, className) {
            if (!members.length) return;

            const sectionLabel = document.createElement('div');
            sectionLabel.className = `section-label ${className}`;
            sectionLabel.textContent = `${label} (${members.length})`;
            elements.membersList.appendChild(sectionLabel);

            members.forEach(member => {
                elements.membersList.appendChild(createMemberCard(member));
            });
        }

        function createMemberCard(member) {
            const card = document.createElement('button');
            card.className = 'member-card';
            card.type = 'button';
            card.addEventListener('click', () => openModal(member));

            const emblemContainer = document.createElement('div');
            emblemContainer.className = 'emblem-container';

            const image = document.createElement('img');
            image.className = 'class-icon';
            image.src = member.classIcon;
            image.alt = member.className;
            image.onerror = () => {
                image.src = 'dlm.ico';
            };

            const memberInfo = document.createElement('div');
            memberInfo.className = 'member-info';

            const memberMain = document.createElement('div');
            memberMain.className = 'member-main';

            const memberName = document.createElement('div');
            memberName.className = 'member-name';

            const status = document.createElement('span');
            status.className = `online-status ${member.isOnline ? 'online' : 'offline'}`;

            const nameText = document.createElement('span');
            nameText.className = 'member-name-text';
            nameText.textContent = member.displayName;

            const memberClass = document.createElement('div');
            memberClass.className = 'member-class';
            memberClass.textContent = member.className;

            const memberTitle = document.createElement('div');
            memberTitle.className = 'member-title';
            memberTitle.textContent = member.title || '';
            memberTitle.hidden = !member.title;

            const activity = document.createElement('div');
            activity.className = 'activity';
            activity.textContent = member.isOnline ? 'Online' : `Ultima attività: ${member.lastActivityText}`;

            const power = document.createElement('div');
            power.className = 'power-level';
            power.textContent = member.powerLevel ? String(member.powerLevel) : '-';

            memberName.append(status, nameText);
            memberMain.append(memberName, memberClass, memberTitle, activity);
            memberInfo.append(memberMain, power);
            emblemContainer.appendChild(image);
            card.append(emblemContainer, memberInfo);

            return card;
        }

        async function openModal(member) {
            elements.modalTitle.textContent = 'Ultime attività';
            elements.modalSubtitle.textContent = member.displayName;
            elements.modal.style.display = 'flex';
            renderActivities(member.activities || []);
        }
        function renderActivities(activities) {
            elements.activityContent.innerHTML = '';

            if (!activities.length) {
                elements.activityContent.innerHTML = '<div class="empty">Nessuna attività trovata.</div>';
                return;
            }

            activities.forEach(activity => {
                const activityItem = document.createElement('div');
                activityItem.className = 'activity-item';

                const title = document.createElement('div');
                title.textContent = activity.name || 'Attività sconosciuta';

                const time = document.createElement('div');
                time.className = 'activity-time';
                time.textContent = formatDate(activity.period);

                activityItem.append(title, time);
                elements.activityContent.appendChild(activityItem);
            });
        }

        function compareMembers(a, b) {
            const aTime = a.lastActivityTimestamp || a.lastPlayedTimestamp || 0;
            const bTime = b.lastActivityTimestamp || b.lastPlayedTimestamp || 0;
            if (aTime !== bTime) return bTime - aTime;
            return a.displayName.localeCompare(b.displayName, 'it');
        }

        function compareDisplayMembers(a, b) {
            if (a.isOnline !== b.isOnline) return a.isOnline ? -1 : 1;
            return compareMembers(a, b);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return 'N/A';
            return date.toLocaleDateString('it-IT') + ' ' + date.toLocaleTimeString('it-IT', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function closeModal() {
            elements.modal.style.display = 'none';
        }

        function updateLastUpdated() {
            lastUpdate = new Date();
            elements.lastUpdated.textContent = `Aggiornato: ${lastUpdate.toLocaleTimeString('it-IT', {
                hour: '2-digit',
                minute: '2-digit'
            })}`;
        }

        function showLoader() {
            elements.membersList.innerHTML = '<div class="loader"></div>';
        }

        function showError(error) {
            const message = error && error.message ? error.message : 'Errore nel caricamento dati.';
            elements.membersList.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.DLM_DEBUG = {
            getCurrentMembers: () => currentMembers,
            groupId: GROUP_ID,
            remoteGroupId: REMOTE_GROUP_ID,
            refresh: loadStaticData
        };
    </script>
</body>
</html>
