<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny Lore Masters - Clan Status</title>
    <link rel="icon" href="dlm.ico" type="image/x-icon">
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #333;
            --panel-light: #444;
            --text: #fff;
            --muted: #aaa;
            --muted-dark: #888;
            --gold: #ffcc00;
            --green: #00d36f;
            --red: #ff4444;
        }

        * {
            box-sizing: border-box;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
            white-space: normal;
        }

        body {
            font-family: Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
            background:
                linear-gradient(rgba(14, 14, 16, .78), rgba(14, 14, 16, .9)),
                url("DLM.jpg") center top / 70% auto fixed,
                var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 8%, rgba(255, 204, 0, .12), transparent 32%),
                rgba(0, 0, 0, .18);
            pointer-events: none;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 18px 18px calc(26px + env(safe-area-inset-bottom));
        }

        .refresh-box {
            background-color: rgba(68, 68, 68, .88);
            backdrop-filter: blur(8px);
            padding: 11px;
            border-radius: 8px;
            color: var(--text);
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 16px;
            border: 0;
            width: 100%;
        }

        .refresh-box:disabled {
            cursor: wait;
            opacity: .7;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .status-bar h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.08;
            letter-spacing: 0;
        }

        .title-lockup {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 14px;
        }

        .brand-logo {
            width: 82px;
            height: 82px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(255, 204, 0, .55);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, .06), 0 10px 28px rgba(0, 0, 0, .35);
            flex: 0 0 auto;
        }

        .title-eyebrow {
            margin: 0 0 4px;
            color: var(--gold);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .title-name {
            display: block;
            font-size: 28px;
        }

        .title-count {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 13px;
            font-weight: normal;
        }

        .last-updated {
            font-size: 14px;
            color: var(--muted);
            text-align: right;
        }

        .clan-meta {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 18px;
        }

        .section-label {
            margin: 14px 0 8px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
            line-height: 1.25;
            font-weight: bold;
            text-transform: uppercase;
        }

        .section-label.online-label {
            color: var(--green);
        }

        .section-label.offline-label {
            color: var(--red);
        }

        .member-card {
            background-color: rgba(51, 51, 51, .9);
            backdrop-filter: blur(8px);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 7px;
            display: grid;
            grid-template-columns: 50px minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            cursor: pointer;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            color: inherit;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.3;
            text-align: left;
            background-clip: padding-box;
            -webkit-tap-highlight-color: rgba(255, 204, 0, .18);
        }

        .member-card:hover {
            border-color: rgba(255, 204, 0, .6);
        }

        .emblem-container {
            flex: 0 0 auto;
        }

        .class-icon {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            background: #222;
        }

        .member-info {
            width: 100%;
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 8px;
        }

        .member-main {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
        }

        .member-name {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 8px;
            font-size: 15px;
            line-height: 1.25;
            font-weight: bold;
        }

        .member-name-text,
        .activity {
            min-width: 0;
            max-width: 100%;
            overflow-wrap: anywhere;
            word-break: normal;
        }

        .member-name-text {
            display: block;
        }

        .member-class {
            margin-top: 4px;
            font-size: 12px;
            line-height: 1.25;
            color: var(--muted);
        }

        .member-title {
            display: block;
            max-width: 100%;
            margin-top: 5px;
            color: var(--gold);
            font-size: 12px;
            font-weight: bold;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .activity {
            margin-top: 4px;
            font-size: 12px;
            line-height: 1.32;
            color: var(--muted-dark);
            display: -webkit-box;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .power-level {
            flex: 0 0 auto;
            font-size: 16px;
            line-height: 1;
            font-weight: bold;
            color: var(--gold);
            margin-left: 0;
            white-space: nowrap;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error,
        .empty {
            color: var(--red);
            text-align: center;
            margin: 20px 0;
            line-height: 1.35;
        }

        .empty {
            color: var(--muted);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background-color: var(--panel);
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 460px;
            max-height: calc(100vh - 32px);
            overflow: auto;
            text-align: left;
            position: relative;
        }

        .modal-title {
            margin: 0 36px 4px 0;
            font-size: 20px;
        }

        .modal-subtitle {
            margin: 0 36px 12px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: var(--text);
            cursor: pointer;
            border: 0;
            background: transparent;
            line-height: 1;
        }

        .activity-item {
            margin: 10px 0;
            padding: 8px;
            background-color: var(--panel-light);
            border-radius: 4px;
        }

        .activity-time {
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .online-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: 0 0 10px;
        }

        .online {
            background-color: var(--green);
        }

        .offline {
            background-color: var(--red);
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px 12px calc(110px + env(safe-area-inset-bottom));
            }

            .status-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .title-lockup {
                gap: 10px;
            }

            .brand-logo {
                width: 68px;
                height: 68px;
            }

            .title-name {
                font-size: 22px;
            }

            .last-updated {
                text-align: left;
            }

            .class-icon {
                width: 44px;
                height: 44px;
            }

            .member-card {
                align-items: flex-start;
                grid-template-columns: 44px minmax(0, 1fr);
                gap: 10px;
                padding: 10px;
            }

            .member-info {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 8px;
            }

            .power-level {
                align-self: start;
                justify-self: end;
                padding-top: 3px;
                font-size: 15px;
            }

            .member-name {
                align-items: flex-start;
                font-size: 15px;
            }

            .online-status {
                margin-top: 4px;
            }

            .member-class,
            .member-title,
            .activity,
            .title-count,
            .last-updated,
            .clan-meta {
                font-size: 12px;
                line-height: 1.35;
            }

            .activity {
                -webkit-line-clamp: 2;
            }
        }

        @media (max-width: 390px) {
            .brand-logo {
                width: 58px;
                height: 58px;
            }

            .title-name {
                font-size: 20px;
            }

            .member-card {
                gap: 8px;
            }

            .class-icon {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="refresh-box" id="refreshButton" type="button">Ricarica dati pubblicati</button>

        <div class="status-bar">
            <div class="title-lockup">
                <img src="dlm.ico" alt="Destiny Lore Masters" class="brand-logo">
                <h1>
                    <span class="title-eyebrow">Destiny 2 Clan</span>
                    <span class="title-name">Destiny Lore Masters</span>
                    <span class="title-count">Membri del clan: <span id="membersCount">0</span></span>
                </h1>
            </div>
            <div class="last-updated" id="lastUpdated"></div>
        </div>
        <div class="clan-meta" id="clanMeta">Clan: Destiny Lore Masters · Group ID 5420062 · Remote ID 6761737</div>
        <div id="membersList"></div>
    </div>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button class="close-modal" type="button" aria-label="Chiudi">&times;</button>
            <h2 class="modal-title" id="modalTitle">Ultime attività</h2>
            <div class="modal-subtitle" id="modalSubtitle"></div>
            <div id="activityContent"></div>
        </div>
    </div>

    <script>
        const GROUP_ID = '5420062';
        const REMOTE_GROUP_ID = '6761737';
        const STATIC_DATA_URL = 'data/clan-status.json';

        let currentMembers = [];

        const elements = {
            refreshButton: document.getElementById('refreshButton'),
            membersCount: document.getElementById('membersCount'),
            lastUpdated: document.getElementById('lastUpdated'),
            membersList: document.getElementById('membersList'),
            modal: document.getElementById('modal'),
            modalTitle: document.getElementById('modalTitle'),
            modalSubtitle: document.getElementById('modalSubtitle'),
            activityContent: document.getElementById('activityContent')
        };

        document.addEventListener('DOMContentLoaded', initializeApp);
        elements.refreshButton.addEventListener('click', loadStaticData);
        document.querySelector('.close-modal').addEventListener('click', closeModal);
        window.addEventListener('click', (event) => {
            if (event.target === elements.modal) closeModal();
        });
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });

        async function initializeApp() {
            showLoader();
            try {
                await loadStaticData();
            } catch (error) {
                console.error('Errore caricamento dati:', error);
                showError(error);
            }
        }

        async function loadStaticData() {
            showLoader();
            elements.refreshButton.disabled = true;

            try {
                const response = await fetch(`${STATIC_DATA_URL}?v=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Dati clan non disponibili. Attendi il completamento della GitHub Action.');
                }

                const data = await response.json();
                currentMembers = (data.members || []).sort(compareMembers);
                elements.membersCount.textContent = String(currentMembers.length);
                elements.lastUpdated.textContent = data.generatedAt
                    ? `Aggiornato: ${formatDate(data.generatedAt)}`
                    : 'Aggiornato: dati pubblicati';
                renderMembers(currentMembers);
            } catch (error) {
                console.error('Errore caricamento dati:', error);
                showError(error);
            } finally {
                elements.refreshButton.disabled = false;
            }
        }
        function renderMembers(members) {
            elements.membersList.innerHTML = '';

            if (!members.length) {
                elements.membersList.innerHTML = '<div class="empty">Nessun membro trovato.</div>';
                return;
            }

            let currentSection = '';
            members.forEach(member => {
                const section = member.isOnline ? 'Online' : 'Offline';
                if (section !== currentSection) {
                    const sectionLabel = document.createElement('div');
                    sectionLabel.className = `section-label ${member.isOnline ? 'online-label' : 'offline-label'}`;
                    sectionLabel.textContent = section;
                    elements.membersList.appendChild(sectionLabel);
                    currentSection = section;
                }
                elements.membersList.appendChild(createMemberCard(member));
            });
        }

        function renderSection(label, members, className) {
            if (!members.length) return;

            const sectionLabel = document.createElement('div');
            sectionLabel.className = `section-label ${className}`;
            sectionLabel.textContent = `${label} (${members.length})`;
            elements.membersList.appendChild(sectionLabel);

            members.forEach(member => {
                elements.membersList.appendChild(createMemberCard(member));
            });
        }

        function createMemberCard(member) {
            const card = document.createElement('button');
            card.className = 'member-card';
            card.type = 'button';
            card.addEventListener('click', () => openModal(member));

            const emblemContainer = document.createElement('div');
            emblemContainer.className = 'emblem-container';

            const image = document.createElement('img');
            image.className = 'class-icon';
            image.src = member.classIcon;
            image.alt = member.className;
            image.onerror = () => {
                image.src = 'dlm.ico';
            };

            const memberInfo = document.createElement('div');
            memberInfo.className = 'member-info';

            const memberMain = document.createElement('div');
            memberMain.className = 'member-main';

            const memberName = document.createElement('div');
            memberName.className = 'member-name';

            const status = document.createElement('span');
            status.className = `online-status ${member.isOnline ? 'online' : 'offline'}`;

            const nameText = document.createElement('span');
            nameText.className = 'member-name-text';
            nameText.textContent = member.displayName;

            const memberClass = document.createElement('div');
            memberClass.className = 'member-class';
            memberClass.textContent = member.className;

            const memberTitle = document.createElement('div');
            memberTitle.className = 'member-title';
            memberTitle.textContent = member.title || '';
            memberTitle.hidden = !member.title;

            const activity = document.createElement('div');
            activity.className = 'activity';
            activity.textContent = member.isOnline ? 'Online' : `Ultima attività: ${member.lastActivityText}`;

            const power = document.createElement('div');
            power.className = 'power-level';
            power.textContent = member.powerLevel ? String(member.powerLevel) : '-';

            memberName.append(status, nameText);
            memberMain.append(memberName, memberClass, memberTitle, activity);
            memberInfo.append(memberMain, power);
            emblemContainer.appendChild(image);
            card.append(emblemContainer, memberInfo);

            return card;
        }

        async function openModal(member) {
            elements.modalTitle.textContent = 'Ultime attività';
            elements.modalSubtitle.textContent = member.displayName;
            elements.modal.style.display = 'flex';
            renderActivities(member.activities || []);
        }
        function renderActivities(activities) {
            elements.activityContent.innerHTML = '';

            if (!activities.length) {
                elements.activityContent.innerHTML = '<div class="empty">Nessuna attività trovata.</div>';
                return;
            }

            activities.forEach(activity => {
                const activityItem = document.createElement('div');
                activityItem.className = 'activity-item';

                const title = document.createElement('div');
                title.textContent = activity.name || 'Attività sconosciuta';

                const time = document.createElement('div');
                time.className = 'activity-time';
                time.textContent = formatDate(activity.period);

                activityItem.append(title, time);
                elements.activityContent.appendChild(activityItem);
            });
        }

        function compareMembers(a, b) {
            const aTime = a.lastActivityTimestamp || a.lastPlayedTimestamp || 0;
            const bTime = b.lastActivityTimestamp || b.lastPlayedTimestamp || 0;
            if (aTime !== bTime) return bTime - aTime;
            return a.displayName.localeCompare(b.displayName, 'it');
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return 'N/A';
            return date.toLocaleDateString('it-IT') + ' ' + date.toLocaleTimeString('it-IT', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function closeModal() {
            elements.modal.style.display = 'none';
        }

        function updateLastUpdated() {
            lastUpdate = new Date();
            elements.lastUpdated.textContent = `Aggiornato: ${lastUpdate.toLocaleTimeString('it-IT', {
                hour: '2-digit',
                minute: '2-digit'
            })}`;
        }

        function showLoader() {
            elements.membersList.innerHTML = '<div class="loader"></div>';
        }

        function showError(error) {
            const message = error && error.message ? error.message : 'Errore nel caricamento dati.';
            elements.membersList.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.DLM_DEBUG = {
            getCurrentMembers: () => currentMembers,
            groupId: GROUP_ID,
            remoteGroupId: REMOTE_GROUP_ID,
            refresh: loadStaticData
        };
    </script>
</body>
</html>
