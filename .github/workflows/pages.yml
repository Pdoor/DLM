name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate Bungie clan data
        run: node scripts/fetch-data.js
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY || '81224e7b397c4b5e9601d8183066729c' }}

      - name: Commit generated clan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clan-status.json data/player-activity.json
          if ! git diff --cached --quiet; then
            git commit -m "Update clan status data [skip ci]"
            git push
          fi

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
